services:
  postgres:
    image: postgres:16
    container_name: blog-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blog
    volumes:
      - blog_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d blog']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  blog_pgdata:
